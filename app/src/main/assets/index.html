<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Spectra</title>
<style>
:root{--bg:#0e0e11;--card:#18181d;--line:#2a2a31;--tx:#f2f1ee;--mut:#9a9aa3;--acc:#e8c37a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Roboto,sans-serif}
.serif{font-family:Georgia,'Times New Roman',serif;font-weight:400;letter-spacing:.2px}
#app{padding:20px 16px 110px;max-width:640px;margin:0 auto}
h1{font-size:36px;margin:8px 0 2px}
h2{font-size:26px;margin:4px 0 2px}
.mut{color:var(--mut)}
.small{font-size:13px}
.search{width:100%;margin:16px 0;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:16px;outline:0}
.search:focus{border-color:var(--acc)}
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin:0 0 14px}
.card .strip{height:74px}
.card .body{padding:12px 16px 14px}
.card .t{font-family:Georgia,serif;font-size:20px}
.daily{display:flex;align-items:center;gap:14px;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;margin:0 0 18px}
.daily i{width:64px;height:64px;border-radius:14px;flex:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:10px;margin-top:16px}
.sw i{display:block;aspect-ratio:1;border-radius:14px;border:1px solid #ffffff14}
.sw b{display:block;font-weight:400;font-size:11px;color:var(--mut);margin-top:5px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back{background:none;border:0;color:var(--acc);font-size:16px;padding:6px 0;margin-bottom:6px}
.big{border-radius:24px;padding:28px 22px;min-height:190px;display:flex;flex-direction:column;justify-content:flex-end;border:1px solid #ffffff14}
.big .n{font-family:Georgia,serif;font-size:30px}
.sl label{display:block;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mut);margin-top:16px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:14px;border-radius:7px;outline:0;margin:10px 0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;border:4px solid #111;box-shadow:0 0 0 2px #ffffff80}
.sec{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mut);margin:26px 0 8px}
.row{display:flex;justify-content:space-between;padding:13px 4px;border-bottom:1px solid var(--line)}
.row span{color:var(--mut)}
.hrow{display:flex;gap:8px;margin-bottom:12px}
.hrow div{flex:1}
.hrow i{display:block;height:54px;border-radius:12px;border:1px solid #ffffff14}
.hrow b{display:block;font-weight:400;font-size:10px;color:var(--mut);margin-top:4px;text-align:center}
.btn{width:100%;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:16px;margin-top:18px}
.btn.on{border-color:var(--acc);color:var(--acc)}
#tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:#0e0e11ee;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#tabs a{flex:1;text-align:center;padding:12px 0 14px;color:var(--mut);font-size:12px;letter-spacing:.5px}
#tabs a b{display:block;font-size:20px;font-weight:400;line-height:1.2}
#tabs a.on{color:var(--acc)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#fff;color:#111;padding:9px 18px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}

.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile i{display:flex;align-items:center;justify-content:center;height:62px;border-radius:12px;font-style:normal;font-size:12px;letter-spacing:1px;border:1px solid #ffffff14}
.tile b{display:block;font-weight:400;font-size:12px;color:var(--mut);margin-top:5px}
.ctx{position:relative;height:104px;border-radius:14px;border:1px solid #ffffff14;display:flex;align-items:center;justify-content:center}
.ctx i{width:46px;height:46px;border-radius:6px}
.ctx b{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-weight:400;font-size:11px;opacity:.8}
.prev{border-radius:22px;padding:26px 22px;border:1px solid #ffffff14}
.pill{display:inline-block;padding:10px 20px;border-radius:24px;font-size:14px}
.bar{height:10px;border-radius:5px;margin-top:22px}
.srow{display:flex;gap:6px;flex:1}
.srow i{flex:1;height:34px;border-radius:8px;border:1px solid #ffffff14}
.warn{background:#2a2216;border:1px solid #5a4620;color:#f0d9a8;border-radius:12px;padding:11px 14px;margin-bottom:8px;font-size:14px}
</style>
</head>
<body>
<div id="app"></div>
<nav id="tabs">
  <a data-t="explore" onclick="tab('#/')"><b>◎</b>Explore</a>
  <a data-t="mix" onclick="tab('#/color/'+last.slice(1))"><b>◐</b>Mix</a>
  <a data-t="brand" onclick="tab('#/brand')"><b>◆</b>Brand</a>
  <a data-t="saved" onclick="tab('#/saved')"><b>♥</b>Saved</a>
</nav>
<div id="toast"></div>
<script>
const app=document.getElementById('app');
const hx=n=>n.toString(16).padStart(2,'0');
const toHex=a=>'#'+a.map(hx).join('');
const parse=h=>{h=String(h).replace('#','').toLowerCase();if(h.length==3)h=[...h].map(c=>c+c).join('');return /^[0-9a-f]{6}$/.test(h)?'#'+h:null};
const rgb=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
const range=(a,b,s)=>{const r=[];for(let v=a;v<=b;v+=s)r.push(v);return r};

function rgb2hsl([r,g,b]){r/=255;g/=255;b/=255;const M=Math.max(r,g,b),m=Math.min(r,g,b),d=M-m;let h=0,s=0;const l=(M+m)/2;
 if(d){s=d/(1-Math.abs(2*l-1));h=M==r?((g-b)/d+6)%6:M==g?(b-r)/d+2:(r-g)/d+4;h*=60}
 return [h,s*100,l*100]}
function hsl2rgb(h,s,l){h=((h%360)+360)%360;s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l);
 const f=n=>l-a*Math.max(-1,Math.min(k(n)-3,9-k(n),1));return [f(0),f(8),f(4)].map(v=>Math.round(v*255))}
const hsl=(h,s,l)=>toHex(hsl2rgb(h,s,l));
function rgb2hsv([r,g,b]){r/=255;g/=255;b/=255;const M=Math.max(r,g,b),m=Math.min(r,g,b),d=M-m;let h=0;
 if(d){h=M==r?((g-b)/d+6)%6:M==g?(b-r)/d+2:(r-g)/d+4;h*=60}return [h,M?d/M*100:0,M*100]}
function rgb2cmyk([r,g,b]){r/=255;g/=255;b/=255;const k=1-Math.max(r,g,b);if(k>=1)return [0,0,0,100];
 return [(1-r-k)/(1-k),(1-g-k)/(1-k),(1-b-k)/(1-k),k].map(v=>v*100)}
const lin=v=>{v/=255;return v>.04045?Math.pow((v+.055)/1.055,2.4):v/12.92};
function lab([r,g,b]){const R=lin(r),G=lin(g),B=lin(b);
 let x=(R*.4124+G*.3576+B*.1805)/.95047,y=R*.2126+G*.7152+B*.0722,z=(R*.0193+G*.1192+B*.9505)/1.08883;
 const t=v=>v>.008856?Math.cbrt(v):7.787*v+16/116;x=t(x);y=t(y);z=t(z);return [116*y-16,500*(x-y),200*(y-z)]}
const lum=([r,g,b])=>.2126*lin(r)+.7152*lin(g)+.0722*lin(b);
const contrast=(a,b)=>{const x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)};
const ink=h=>contrast(rgb(h),[255,255,255])>=contrast(rgb(h),[17,17,17])?'#fff':'#111';

// Physical spectra
function nm2rgb(w){let r=0,g=0,b=0;
 if(w<440){r=-(w-440)/60;b=1}else if(w<490){g=(w-440)/50;b=1}else if(w<510){g=1;b=-(w-510)/20}
 else if(w<580){r=(w-510)/70;g=1}else if(w<645){r=1;g=-(w-645)/65}else{r=1}
 const f=w<420?.3+.7*(w-380)/40:w>700?.3+.7*(780-w)/80:1;
 return [r,g,b].map(c=>Math.round(255*Math.pow(c*f,.8)))}
function kelvin(K){const t=K/100;
 const r=t<=66?255:329.698727446*Math.pow(t-60,-.1332047592);
 const g=t<=66?99.4708025861*Math.log(t)-161.1195681661:288.1221695283*Math.pow(t-60,-.0755148492);
 const b=t>=66?255:t<=19?0:138.5177312231*Math.log(t-10)-305.0447927307;
 return [r,g,b].map(c=>Math.max(0,Math.min(255,Math.round(c))))}
const lerp=(stops,t)=>{const x=t*(stops.length-1),i=Math.min(Math.floor(x),stops.length-2),f=x-i,a=rgb(stops[i]),b=rgb(stops[i+1]);
 return toHex(a.map((v,k)=>Math.round(v+(b[k]-v)*f)))};

// Named colors (W3C / CSS)
const NAMES=`aliceblue f0f8ff antiquewhite faebd7 aquamarine 7fffd4 azure f0ffff beige f5f5dc bisque ffe4c4 black 000000 blanchedalmond ffebcd blue 0000ff blueviolet 8a2be2 brown a52a2a burlywood deb887 cadetblue 5f9ea0 chartreuse 7fff00 chocolate d2691e coral ff7f50 cornflowerblue 6495ed cornsilk fff8dc crimson dc143c cyan 00ffff darkblue 00008b darkcyan 008b8b darkgoldenrod b8860b darkgray a9a9a9 darkgreen 006400 darkkhaki bdb76b darkmagenta 8b008b darkolivegreen 556b2f darkorange ff8c00 darkorchid 9932cc darkred 8b0000 darksalmon e9967a darkseagreen 8fbc8f darkslateblue 483d8b darkslategray 2f4f4f darkturquoise 00ced1 darkviolet 9400d3 deeppink ff1493 deepskyblue 00bfff dimgray 696969 dodgerblue 1e90ff firebrick b22222 floralwhite fffaf0 forestgreen 228b22 gainsboro dcdcdc ghostwhite f8f8ff gold ffd700 goldenrod daa520 gray 808080 green 008000 greenyellow adff2f honeydew f0fff0 hotpink ff69b4 indianred cd5c5c indigo 4b0082 ivory fffff0 khaki f0e68c lavender e6e6fa lavenderblush fff0f5 lawngreen 7cfc00 lemonchiffon fffacd lightblue add8e6 lightcoral f08080 lightcyan e0ffff lightgoldenrodyellow fafad2 lightgray d3d3d3 lightgreen 90ee90 lightpink ffb6c1 lightsalmon ffa07a lightseagreen 20b2aa lightskyblue 87cefa lightslategray 778899 lightsteelblue b0c4de lightyellow ffffe0 lime 00ff00 limegreen 32cd32 linen faf0e6 magenta ff00ff maroon 800000 mediumaquamarine 66cdaa mediumblue 0000cd mediumorchid ba55d3 mediumpurple 9370db mediumseagreen 3cb371 mediumslateblue 7b68ee mediumspringgreen 00fa9a mediumturquoise 48d1cc mediumvioletred c71585 midnightblue 191970 mintcream f5fffa mistyrose ffe4e1 moccasin ffe4b5 navajowhite ffdead navy 000080 oldlace fdf5e6 olive 808000 olivedrab 6b8e23 orange ffa500 orangered ff4500 orchid da70d6 palegoldenrod eee8aa palegreen 98fb98 paleturquoise afeeee palevioletred db7093 papayawhip ffefd5 peachpuff ffdab9 peru cd853f pink ffc0cb plum dda0dd powderblue b0e0e6 purple 800080 rebeccapurple 663399 red ff0000 rosybrown bc8f8f royalblue 4169e1 saddlebrown 8b4513 salmon fa8072 sandybrown f4a460 seagreen 2e8b57 seashell fff5ee sienna a0522d silver c0c0c0 skyblue 87ceeb slateblue 6a5acd slategray 708090 snow fffafa springgreen 00ff7f steelblue 4682b4 tan d2b48c teal 008080 thistle d8bfd8 tomato ff6347 turquoise 40e0d0 violet ee82ee wheat f5deb3 white ffffff whitesmoke f5f5f5 yellow ffff00 yellowgreen 9acd32`.split(/\s+/);
const CSS=[];
for(let i=0;i<NAMES.length;i+=2){const h='#'+NAMES[i+1];CSS.push({n:NAMES[i][0].toUpperCase()+NAMES[i].slice(1),h,l:lab(rgb(h))})}
function nameOf(hex){const L=lab(rgb(hex));let best=null,bd=1e9;
 for(const c of CSS){const d=Math.hypot(c.l[0]-L[0],c.l[1]-L[1],c.l[2]-L[2]);if(d<bd){bd=d;best=c}}
 return (bd<1?'':'≈ ')+best.n}

// Collections
const COLS=[];
const add=(id,name,note,items)=>COLS.push({id,name,note,items:items.map(([h,n])=>({h,n}))});
const HN=['Red','Orange','Yellow','Chartreuse','Green','Spring','Cyan','Azure','Blue','Violet','Magenta','Rose'];
add('visible','Visible light','Newton’s prism · 380–780 nm',range(380,780,5).map(w=>[toHex(nm2rgb(w)),w+' nm']));
add('newton','Newton’s seven','Red to violet · 1704',[['#ff0000','Red'],['#ff7f00','Orange'],['#ffff00','Yellow'],['#00ff00','Green'],['#0000ff','Blue'],['#4b0082','Indigo'],['#8f00ff','Violet']]);
add('wheel','Hue wheel','Every 5° around the circle',range(0,355,5).map(h=>[hsl(h,100,50),h+'°']));
add('kelvin','Glowing metal','Blackbody · 1000–12000 K',range(1000,12000,250).map(k=>[toHex(kelvin(k)),k+' K']));
add('tonal','Tonal grid','12 hues × 9 lightness steps',HN.flatMap((n,i)=>[95,85,75,65,55,45,35,25,15].map(l=>[hsl(i*30,80,l),n+' '+l])));
add('css','Named colors','W3C web names',[...CSS].sort((a,b)=>{const A=rgb2hsl(rgb(a.h)),B=rgb2hsl(rgb(b.h));return (A[1]<8?1000+A[2]:A[0])-(B[1]<8?1000+B[2]:B[0])}).map(c=>[c.h,c.n]));
add('safe','Web-safe 216','The 1990s browser palette',(()=>{const v=['00','33','66','99','cc','ff'],o=[];for(const r of v)for(const g of v)for(const b of v)o.push(['#'+r+g+b,'#'+r+g+b]);return o})());
add('pastel','Pastel','Soft and airy',range(0,345,15).map(h=>[hsl(h,70,85),h+'°']));
add('vivid','Vivid','Full strength',range(0,345,15).map(h=>[hsl(h,100,50),h+'°']));
add('deep','Deep','Rich and dark',range(0,345,15).map(h=>[hsl(h,60,25),h+'°']));
add('earth','Earth tones','Soil, clay, bark and moss',['Sienna','Saddlebrown','Peru','Chocolate','Brown','Tan','Burlywood','Wheat','Sandybrown','Goldenrod','Darkgoldenrod','Olive','Olivedrab','Darkolivegreen','Darkkhaki','Khaki','Rosybrown','Indianred','Beige','Darkseagreen'].map(n=>{const c=CSS.find(x=>x.n==n);return [c.h,n]}));
const CMAPS={Viridis:['#440154','#482878','#3e4989','#31688e','#26828e','#1f9e89','#35b779','#6ece58','#b5de2b','#fde725'],
 Plasma:['#0d0887','#46039f','#7201a8','#9c179e','#bd3786','#d8576b','#ed7953','#fb9f3a','#fdca26','#f0f921'],
 Magma:['#000004','#3b0f70','#8c2981','#de4968','#fe9f6d','#fcfdbf']};
for(const k in CMAPS)add(k.toLowerCase(),k,'Scientific colormap · 2015',range(0,23,1).map(i=>[lerp(CMAPS[k],i/23),k+' '+(i+1)]));
add('gray','Greys','33 steps of neutral',range(0,256,8).map(v=>[toHex([Math.min(v,255),Math.min(v,255),Math.min(v,255)]),String(v)]));
const TOTAL=COLS.reduce((a,c)=>a+c.items.length,0);

// Light, vision, brand
const REF=kelvin(6500);
const gam=v=>Math.round(255*(v<=.0031308?12.92*v:1.055*Math.pow(v,1/2.4)-.055));
const clamp01=v=>Math.max(0,Math.min(1,v));
const relight=(hex,K)=>{const w=kelvin(K);return toHex(rgb(hex).map((v,i)=>gam(clamp01(lin(v)*lin(w[i])/lin(REF[i])))))};
const LIGHTS=[['Candle',1900],['Warm LED',2700],['Halogen',3200],['Fluorescent',4100],['Daylight',5500],['Open shade',7500]];
const VIS=[['Protanopia',[[.152286,1.052583,-.204868],[.114503,.786281,.099216],[-.003882,-.048116,1.051998]]],
 ['Deuteranopia',[[.367322,.860646,-.227968],[.280085,.672501,.047413],[-.01182,.04294,.968881]]],
 ['Tritanopia',[[1.255528,-.076749,-.178779],[-.078411,.930809,.147602],[.004733,.691367,.3039]]]];
const vision=(hex,m)=>{const l=rgb(hex).map(lin);return toHex(m.map(r=>gam(clamp01(r[0]*l[0]+r[1]*l[1]+r[2]*l[2]))))};
const mono=hex=>{const y=gam(clamp01(lum(rgb(hex))));return toHex([y,y,y])};
const VSIM=[['Normal',x=>x],...VIS.map(([n,m])=>[n,x=>vision(x,m)]),['Monochrome',mono]];
const dE=(a,b)=>{const x=lab(rgb(a)),y=lab(rgb(b));return Math.hypot(x[0]-y[0],x[1]-y[1],x[2]-y[2])};
const tiles=arr=>'<div class="tiles">'+arr.map(([n,c])=>`<div class="tile"><i style="background:${c};color:${ink(c)}">${c.toUpperCase()}</i><b>${n}</b></div>`).join('')+'</div>';
const lightSec=hex=>`<div class="sec">Under different light</div>`+tiles(LIGHTS.map(([n,k])=>[n+' · '+k+' K',relight(hex,k)]))+`<div class="small mut" style="margin-top:6px">Approximation, for a screen balanced to daylight.</div>`;
const visSec=hex=>`<div class="sec">How others may see it</div>`+tiles(VSIM.map(([n,f])=>[n,f(hex)]))+`<div class="small mut" style="margin-top:6px">Simulation of common color-vision differences.</div>`;
function ctxSec(hex,h,s,l){
 const bgs=[['White','#ffffff'],['Light grey','#d9d9d9'],['Mid grey','#808080'],['Black','#000000'],['Opposite',hsl(h+180,s,l)],['Neighbor',hsl(h+30,s,Math.min(90,l+15))]];
 return `<div class="sec">On different backgrounds</div><div class="tiles">`+bgs.map(([n,b])=>`<div class="ctx" style="background:${b}"><i style="background:${hex}"></i><b style="color:${ink(b)}">${n}</b></div>`).join('')+`</div><div class="small mut" style="margin-top:6px">Same color, different neighbors. Watch it seem to change.</div>`}
function fixContrast(hex,against,target){
 const [h,s,l]=rgb2hsl(rgb(hex)),dir=lum(rgb(against))>.5?-1:1;let x=l;
 for(let i=0;i<100;i++){const c=hsl(h,s,Math.max(0,Math.min(100,x)));if(contrast(rgb(c),rgb(against))>=target)return c;x+=dir}
 return null}
const SLOTS=[['p','Primary'],['s','Secondary'],['a','Accent']];
const bstore={get(){try{return JSON.parse(localStorage.getItem('spectra.brand')||'{}')}catch(e){return{}}},
 set(v){try{localStorage.setItem('spectra.brand',JSON.stringify(v))}catch(e){}}};
function setBrand(k,hex){const b=bstore.get();b[k]=hex;bstore.set(b);toast('Set as '+SLOTS.find(x=>x[0]==k)[1])}
function clearBrand(k){const b=bstore.get();delete b[k];bstore.set(b);brand()}
const grade=r=>r>=7?'AAA':r>=4.5?'AA':r>=3?'Large text only':'Fail';
function brand(){
 const b=bstore.get(),set=SLOTS.filter(([k])=>b[k]),cols=set.map(([k])=>b[k]);
 let out=`<h2 class="serif">Brand</h2><div class="mut">Pick up to three colors. On any color page, tap “Use in brand”.</div><div class="sec">Your colors</div>`;
 out+=SLOTS.map(([k,n])=>b[k]?`<div class="daily" style="padding:10px;margin-bottom:10px"><i style="background:${b[k]}" onclick="go('#/color/${b[k].slice(1)}')"></i><div style="flex:1"><div class="small mut">${n.toUpperCase()}</div><div class="serif" style="font-size:20px">${nameOf(b[k])}</div><div class="small mut">${b[k].toUpperCase()}</div></div><button class="back" onclick="clearBrand('${k}')">Remove</button></div>`:`<div class="daily" style="padding:10px;margin-bottom:10px;opacity:.6"><i style="background:transparent;border:1px dashed #555"></i><div><div class="small mut">${n.toUpperCase()}</div><div class="mut">Not set</div></div></div>`).join('');
 if(!set.length){app.innerHTML=out+`<button class="btn" onclick="tab('#/')">Browse colors</button>`;return}
 const main=cols[0],pill=cols.length>1?cols[cols.length-1]:null,bar=cols.length>2?cols[1]:null;
 out+=`<div class="sec">Preview</div><div class="prev" style="background:${main};color:${ink(main)}"><div class="serif" style="font-size:28px">Your brand</div><p style="margin:8px 0 16px">A line of body text to see how it reads.</p>${pill?`<span class="pill" style="background:${pill};color:${ink(pill)}">Call to action</span>`:''}${bar?`<div class="bar" style="background:${bar}"></div>`:''}</div>`;
 out+='<div class="sec">Text on each color</div>'+set.map(([k,n])=>{const c=b[k],w=contrast(rgb(c),[255,255,255]),bl=contrast(rgb(c),[0,0,0]),r=Math.max(w,bl);
  return `<div class="row"><span>${n}</span><b style="font-weight:500">${w>=bl?'White':'Black'} text · ${r.toFixed(1)}:1 ${grade(r)}</b></div>`}).join('');
 const pairs=[];for(let i=0;i<set.length;i++)for(let j=i+1;j<set.length;j++)pairs.push([set[i],set[j]]);
 if(pairs.length)out+='<div class="sec">Between your colors</div>'+pairs.map(([[k1,n1],[k2,n2]])=>{
  const r=contrast(rgb(b[k1]),rgb(b[k2]));let fix='';
  if(r<3){const f=fixContrast(b[k2],b[k1],3);if(f)fix=`<div class="small mut" style="padding:0 4px 10px">To separate them, try <a onclick="go('#/color/${f.slice(1)}')" style="color:var(--acc)">${f.toUpperCase()}</a> for ${n2}.</div>`}
  return `<div class="row"><span>${n1} / ${n2}</span><b style="font-weight:500">${r.toFixed(1)}:1 ${r>=3?'Distinct':'Too close'}</b></div>`+fix}).join('');
 const rows=(title,sims)=>`<div class="sec">${title}</div>`+sims.map(([n,f])=>`<div class="row" style="align-items:center;gap:10px"><span style="min-width:104px">${n}</span><div class="srow">${cols.map(c=>`<i style="background:${f(c)}"></i>`).join('')}</div></div>`).join('');
 out+=rows('Under different light',LIGHTS.filter(x=>[1900,2700,4100,5500].includes(x[1])).map(([n,k])=>[n,x=>relight(x,k)]));
 out+=rows('Color vision',VSIM);
 const warn=[];
 for(const [vn,f] of VSIM.slice(1))for(const [[k1,n1],[k2,n2]] of pairs)if(dE(f(b[k1]),f(b[k2]))<15&&dE(b[k1],b[k2])>=15)warn.push(`${n1} and ${n2} look alike with ${vn}.`);
 if(warn.length)out+='<div class="sec">Heads up</div>'+warn.map(w=>`<div class="warn">${w}</div>`).join('');
 app.innerHTML=out}

// State, helpers
let last='#e8c37a';
const store={get(){try{return JSON.parse(localStorage.getItem('spectra.saved')||'[]')}catch(e){return[]}},
 set(v){try{localStorage.setItem('spectra.saved',JSON.stringify(v))}catch(e){}}};
const go=h=>{location.hash=h};
const tab=h=>{location.replace(h)};
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.className='show';clearTimeout(toast.t);toast.t=setTimeout(()=>e.className='',1300)}
function cp(t){try{if(window.Android){Android.copy(t)}else navigator.clipboard.writeText(t)}catch(e){}toast('Copied '+t)}
const grid=items=>'<div class="grid">'+items.map(i=>`<div class="sw" onclick="go('#/color/${i.h.slice(1)}')"><i style="background:${i.h}"></i><b>${i.n}</b></div>`).join('')+'</div>';
const back=()=>'<button class="back" onclick="history.length>1?history.back():tab(\'#/\')">‹ Back</button>';

// Views
function home(){
 const d=CSS[Math.floor(Date.now()/864e5)%CSS.length];
 app.innerHTML=`<h1 class="serif">Spectra</h1><div class="mut">Find your way through color · ${TOTAL.toLocaleString()} curated shades, 16.7 million mixable</div>
 <input id="q" class="search" placeholder="Search a name, hex or wavelength" oninput="search(this.value)" autocomplete="off">
 <div id="res"></div>
 <div id="cols">
 <div class="daily" onclick="go('#/color/${d.h.slice(1)}')"><i style="background:${d.h}"></i><div><div class="small mut">COLOR OF THE DAY</div><div class="serif" style="font-size:22px">${d.n}</div><div class="small mut">${d.h.toUpperCase()}</div></div></div>
 ${COLS.map(c=>{const n=Math.min(14,c.items.length),cs=range(0,n-1,1).map(i=>c.items[Math.round(i*(c.items.length-1)/(n-1))].h);
  return `<div class="card" onclick="go('#/c/${c.id}')"><div class="strip" style="background:linear-gradient(90deg,${cs.join(',')})"></div><div class="body"><div class="t">${c.name}</div><div class="small mut">${c.note} · ${c.items.length}</div></div></div>`}).join('')}
 </div>`}
function search(v){
 v=v.trim().toLowerCase();const res=document.getElementById('res'),cols=document.getElementById('cols');
 if(!v){res.innerHTML='';cols.style.display='';return}
 cols.style.display='none';
 let out=[];const p=parse(v);if(p)out.push({h:p,n:p});
 const seen=new Set();
 for(const c of COLS)for(const i of c.items){if(i.n.toLowerCase().includes(v)||i.h.includes(v.replace('#',''))){const k=i.h+i.n;if(!seen.has(k)){seen.add(k);out.push(i)}}}
 res.innerHTML=out.length?grid(out.slice(0,150)):'<p class="mut">Nothing found. Try a hex like #3a7bd5 or a name like coral.</p>'}
function collection(id){
 const c=COLS.find(x=>x.id==id);if(!c)return home();
 app.innerHTML=`${back()}<h2 class="serif">${c.name}</h2><div class="mut">${c.note} · ${c.items.length} colors</div>${grid(c.items)}`}
function saved(){
 const s=store.get();
 app.innerHTML=`<h2 class="serif">Saved</h2><div class="mut">${s.length} color${s.length==1?'':'s'}</div>`+
 (s.length?grid(s.map(h=>({h,n:h})))+`<button class="btn" onclick="cp('${s.join(' ')}')">Copy all as list</button>`:'<p class="mut">Tap ♥ on any color to keep it here.</p>')}
function detail(hex){
 last=hex;const [h,s,l]=rgb2hsl(rgb(hex));
 app.innerHTML=`${back()}<div class="big" id="big"><div class="n" id="nm"></div><div id="hxl"></div></div>
 <div class="sl"><label>Hue</label><input type="range" id="H" min="0" max="360" value="${Math.round(h)}" oninput="slide()">
 <label>Saturation</label><input type="range" id="S" min="0" max="100" value="${Math.round(s)}" oninput="slide()">
 <label>Lightness</label><input type="range" id="L" min="0" max="100" value="${Math.round(l)}" oninput="slide()"></div>
 <div id="inf"></div>`;
 paint(hex)}
function slide(){const g=i=>+document.getElementById(i).value;const hex=hsl(g('H'),g('S'),g('L'));last=hex;history.replaceState(null,'','#/color/'+hex.slice(1));paint(hex)}
function paint(hex){
 const big=document.getElementById('big'),c=ink(hex);
 big.style.background=hex;big.style.color=c;
 document.getElementById('nm').textContent=nameOf(hex);
 document.getElementById('hxl').textContent=hex.toUpperCase();
 const H=document.getElementById('H'),S=document.getElementById('S'),L=document.getElementById('L');
 const [h,s,l]=[+H.value,+S.value,+L.value];
 H.style.background='linear-gradient(90deg,'+range(0,360,30).map(x=>hsl(x,s,l)).join(',')+')';
 S.style.background=`linear-gradient(90deg,${hsl(h,0,l)},${hsl(h,100,l)})`;
 L.style.background=`linear-gradient(90deg,#000,${hsl(h,s,50)},#fff)`;
 document.getElementById('inf').innerHTML=info(hex)}
function info(hex){
 const c=rgb(hex),[h,s,l]=rgb2hsl(c),v=rgb2hsv(c),k=rgb2cmyk(c),L=lab(c),R=n=>Math.round(n);
 const row=(a,b)=>`<div class="row" onclick="cp('${b}')"><span>${a}</span><b style="font-weight:500">${b}</b></div>`;
 const hr=(t,arr)=>`<div class="sec">${t}</div><div class="hrow">${arr.map(x=>{const q=hsl(x[0],x[1],x[2]);return `<div onclick="go('#/color/${q.slice(1)}')"><i style="background:${q}"></i><b>${q.toUpperCase()}</b></div>`}).join('')}</div>`;
 const w=contrast(c,[255,255,255]),b=contrast(c,[0,0,0]);
 const fav=store.get().includes(hex);
 return `<div class="sec">Values · tap to copy</div>`+
 row('HEX',hex.toUpperCase())+row('RGB',`${c[0]}, ${c[1]}, ${c[2]}`)+row('HSL',`${R(h)}°, ${R(s)}%, ${R(l)}%`)+
 row('HSV',`${R(v[0])}°, ${R(v[1])}%, ${R(v[2])}%`)+row('CMYK',k.map(R).join(', '))+row('LAB',L.map(R).join(', '))+
 `<div class="sec">Readability</div><div class="row"><span>White text</span><b style="font-weight:500">${w.toFixed(1)}:1 ${w>=7?'AAA':w>=4.5?'AA':w>=3?'Large only':'Fail'}</b></div>
 <div class="row"><span>Black text</span><b style="font-weight:500">${b.toFixed(1)}:1 ${b>=7?'AAA':b>=4.5?'AA':b>=3?'Large only':'Fail'}</b></div>`+
 lightSec(hex)+ctxSec(hex,h,s,l)+visSec(hex)+hr('Complement',[[h,s,l],[h+180,s,l]])+hr('Analogous',[[h-30,s,l],[h,s,l],[h+30,s,l]])+
 hr('Triad',[[h,s,l],[h+120,s,l],[h+240,s,l]])+hr('Tetrad',[[h,s,l],[h+90,s,l],[h+180,s,l],[h+270,s,l]])+
 hr('Split complement',[[h,s,l],[h+150,s,l],[h+210,s,l]])+
 hr('Shades',[92,78,64,50,36,22,10].map(x=>[h,s,x]))+
 `<button class="btn ${fav?'on':''}" onclick="toggleFav('${hex}')">${fav?'♥ Saved':'♡ Save this color'}</button><div class="sec">Use in brand</div><div class="hrow">${SLOTS.map(([k,n])=>`<button class="btn" style="margin-top:0" onclick="setBrand('${k}','${hex}')">${n}</button>`).join('')}</div>`}
function toggleFav(hex){let s=store.get();s=s.includes(hex)?s.filter(x=>x!=hex):[hex,...s];store.set(s);document.getElementById('inf').innerHTML=info(hex)}

// Router
function route(){
 const [a,b]=location.hash.slice(2).split('/');window.scrollTo(0,0);
 if(a=='c')collection(b);else if(a=='color')detail(parse(b)||'#808080');else if(a=='saved')saved();else if(a=='brand')brand();else home();
 const t=a=='color'?'mix':a=='saved'?'saved':a=='brand'?'brand':'explore';
 document.querySelectorAll('#tabs a').forEach(x=>x.classList.toggle('on',x.dataset.t==t))}
window.addEventListener('hashchange',route);route();
</script>
</body>
</html>
